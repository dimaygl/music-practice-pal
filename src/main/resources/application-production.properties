## Production database configuration (provided via environment variables)
spring.datasource.driverClassName=org.postgresql.Driver

# host.docker.internal is used to connect to the host machine from within a Docker container.
# This is useful for local development when the database is running on the host machine.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music-practice-pal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

## Production JPA/Hibernate defaults
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
