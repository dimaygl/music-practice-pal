<!doctype html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice Pal</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
  </head>
  <body class="d-flex min-vh-100 flex-column bg-body text-body">
    <header>
      <nav class="navbar bg-body border-bottom border-secondary-subtle py-3" aria-label="Main navigation">
        <div class="container d-flex justify-content-between align-items-center">
          <a class="navbar-brand d-flex align-items-center gap-3 me-0" th:href="@{/}">
            <span class="d-inline-flex align-items-center justify-content-center" aria-hidden="true">
              <span class="fs-1 lh-1">🎸</span>
            </span>
            <span class="d-flex flex-column lh-sm">
              <strong class="fs-5 text-body">Practice Pal</strong>
              <small class="text-body-secondary fw-normal mt-1">Your pal for daily guitar practice</small>
            </span>
          </a>
          <a class="btn btn-primary" th:href="@{/login}">Log in</a>
        </div>
      </nav>
    </header>

    <main class="container flex-grow-1 py-4 py-md-5">
      <div class="row g-4">
        <aside class="col-12 col-lg-3" aria-label="Practice menu">
          <nav class="card bg-body-tertiary border border-secondary-subtle" aria-label="Practice sections">
            <div class="card-body">
              <h2 class="h6 text-uppercase text-body-secondary mb-3">Menu</h2>
              <ul class="nav nav-pills flex-column gap-2">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#daily-tasks">Daily Tasks</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" th:href="@{/song-charts}">Song Charts</a>
                </li>
              </ul>
            </div>
          </nav>
        </aside>

        <div class="col-12 col-lg-9">
          <div class="row g-4" id="daily-tasks">
            <section class="col-12" aria-labelledby="scale-heading">
              <div class="card bg-body-tertiary border border-secondary-subtle shadow-sm">
                <div class="card-body p-4 p-md-5 text-center">
                  <h1 class="card-title h2 fw-bold mb-3" id="scale-heading">Scale to Practice</h1>
                  <p class="h5 text-primary mb-3">A</p>
                  <ul class="d-inline-block text-start mb-0">
                    <li>all positions</li>
                    <li>cross positions</li>
                  </ul>
                </div>
              </div>
            </section>

            <section class="col-12" aria-labelledby="song-heading">
              <div class="card bg-body-tertiary border border-secondary-subtle shadow-sm">
                <div class="card-body p-4 p-md-5 text-center">
                  <h2 class="card-title h2 fw-bold mb-3" id="song-heading">Song to practice</h2>
                  <p class="h5 text-primary mb-0">Gotten</p>
                </div>
              </div>
            </section>

            <section class="col-12" aria-labelledby="lesson-heading">
              <div class="card bg-body-tertiary border border-secondary-subtle shadow-sm">
                <div class="card-body p-4 p-md-5 text-center">
                  <h2 class="card-title h2 fw-bold mb-3" id="lesson-heading">Lesson to practice</h2>
                  <p class="text-body-secondary mb-0">Your next lesson will appear here.</p>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-auto border-top border-secondary-subtle bg-body py-4 text-center text-body-secondary">
      <div class="container">
        <small>&copy; Practice Pal , Written by Dima Yaglin</small>
      </div>
    </footer>
  </body>
</html>
